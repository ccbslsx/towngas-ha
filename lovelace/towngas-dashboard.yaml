# ============================================================
# 港华燃气 Towngas · Lovelace 仪表盘（用气 / 账单 / 统计分析）
# ============================================================
# 适用：Home Assistant
#
# 【前置依赖】
#   主方案用到了 apexcharts-card（HACS 社区卡片，做历史比对/统计最顺手）。
#   安装：HACS → 自定义仓库 → 添加 https://github.com/RomRider/apexcharts-card
#         （类别：Dashboard）→ 下载 → 重启前端（F5）。
#   若不想装任何社区卡片，文件最下方附了「纯原生备用方案」（history-graph / statistics-graph，零依赖）。
#
# 【实体命名 · 重要】
#   你的 HA 把中文名转成了拼音 slug，实体 id 形如：
#       sensor.gang_hua_ran_qi_<subs_code>_<拼音>
#   例：sensor.gang_hua_ran_qi_1500185660_ben_qi_biao_shu   （本期表数）
#       sensor.gang_hua_ran_qi_1500185660_ben_qi_yong_qi    （本期用气）
#   下面已按你实际的两个户号写好。拼音映射表（用于核对/替换）：
#       本期表数=ben_qi_biao_shu   本期用气=ben_qi_yong_qi   上期表数=shang_qi_biao_shu
#       本期账单金额=ben_qi_zhang_dan_jin_e   用气单价=yong_qi_dan_jia
#       账户余额=zhang_hu_yu_e   欠费金额=qian_fei_jin_e   账期=zhang_qi
#   若某图表空白，说明该传感器的拼音拼写与上面不同 —— 到「开发者工具 → 状态」搜
#   gang_hua_ran_qi，把对应实体 id 替换进本文件即可。
#   概览卡用了 auto-entities，无论 id 长啥样都会自动出现。
#
# 【用法】
#   方式一（独立仪表盘）：设置 → 仪表盘 → + 添加仪表盘 → 从空开始 →
#           右上角 ⋮ → 原始配置编辑器 → 把本文件整个 views: 段粘进去保存。
#   方式二（并入现有）：把你现有 dashboard 原始配置里本文件 views: 内的 view 贴进它的 views: 列表。
# ============================================================

title: 港华燃气
views:
  - title: 燃气总览
    path: towngas
    icon: mdi:gas-cylinder
    badges: []
    cards:

      # ---------- 头部说明 ----------
      - type: markdown
        content: |
          # 🔥 港华燃气 · 用气与账单看板
          数据来源：微信中央 VCC 网关，默认每 6 小时刷新一次。
          所有「本期」数值取自最近一个抄表账期（如 `2026-08`）。
          月度柱状图即为 **历史比对**；最小/平均/最大折线为 **统计分析**。

      # ---------- 概览（每个户号一张 glance，无 HACS 依赖） ----------
      - type: glance
        title: 概览 · 1500185660
        columns: 4
        show_state: true
        entities:
          - entity: sensor.gang_hua_ran_qi_1500185660_ben_qi_yong_qi
          - entity: sensor.gang_hua_ran_qi_1500185660_ben_qi_biao_shu
          - entity: sensor.gang_hua_ran_qi_1500185660_shang_qi_biao_shu
          - entity: sensor.gang_hua_ran_qi_1500185660_ben_qi_zhang_dan_jin_e
          - entity: sensor.gang_hua_ran_qi_1500185660_yong_qi_dan_jia
          - entity: sensor.gang_hua_ran_qi_1500185660_zhang_hu_yu_e
          - entity: sensor.gang_hua_ran_qi_1500185660_qian_fei_jin_e
          - entity: sensor.gang_hua_ran_qi_1500185660_zhang_qi
      - type: glance
        title: 概览 · 1500185695
        columns: 4
        show_state: true
        entities:
          - entity: sensor.gang_hua_ran_qi_1500185695_ben_qi_yong_qi
          - entity: sensor.gang_hua_ran_qi_1500185695_ben_qi_biao_shu
          - entity: sensor.gang_hua_ran_qi_1500185695_shang_qi_biao_shu
          - entity: sensor.gang_hua_ran_qi_1500185695_ben_qi_zhang_dan_jin_e
          - entity: sensor.gang_hua_ran_qi_1500185695_yong_qi_dan_jia
          - entity: sensor.gang_hua_ran_qi_1500185695_zhang_hu_yu_e
          - entity: sensor.gang_hua_ran_qi_1500185695_qian_fei_jin_e
          - entity: sensor.gang_hua_ran_qi_1500185695_zhang_qi

      # ---------- 用气量与累计表数趋势（折线 + 柱） ----------
      - type: custom:apexcharts-card
        graph_span: "13month"
        header:
          show: true
          title: 用气量与累计表数趋势
        series:
          - entity: sensor.gang_hua_ran_qi_1500185660_ben_qi_biao_shu
            name: 累计表数 1500185660
            type: line
            color: "#E63946"
            stroke_width: 3
          - entity: sensor.gang_hua_ran_qi_1500185660_ben_qi_yong_qi
            name: 本期用气 1500185660
            type: column
            color: "#457B9D"
          - entity: sensor.gang_hua_ran_qi_1500185695_ben_qi_biao_shu
            name: 累计表数 1500185695
            type: line
            color: "#F4A261"
            stroke_width: 3
          - entity: sensor.gang_hua_ran_qi_1500185695_ben_qi_yong_qi
            name: 本期用气 1500185695
            type: column
            color: "#2A9D8F"

      # ---------- 月度用气对比（历史比对核心） ----------
      - type: custom:apexcharts-card
        graph_span: "13month"
        header:
          show: true
          title: 月度用气对比（历史比对）
        series:
          - entity: sensor.gang_hua_ran_qi_1500185660_ben_qi_yong_qi
            name: 1500185660
            type: column
            color: "#457B9D"
            group_by:
              func: avg
              duration: 1month
          - entity: sensor.gang_hua_ran_qi_1500185695_ben_qi_yong_qi
            name: 1500185695
            type: column
            color: "#2A9D8F"
            group_by:
              func: avg
              duration: 1month

      # ---------- 账单金额趋势 ----------
      - type: custom:apexcharts-card
        graph_span: "13month"
        header:
          show: true
          title: 账单金额趋势（¥）
        series:
          - entity: sensor.gang_hua_ran_qi_1500185660_ben_qi_zhang_dan_jin_e
            name: 账单 1500185660
            type: area
            color: "#E63946"
            opacity: 0.35
          - entity: sensor.gang_hua_ran_qi_1500185695_ben_qi_zhang_dan_jin_e
            name: 账单 1500185695
            type: area
            color: "#2A9D8F"
            opacity: 0.35

      # ---------- 用气统计（最小 / 平均 / 最大） ----------
      - type: statistics-graph
        title: 用气统计（每月 最小 / 平均 / 最大）
        period: month
        days_to_show: 365
        stat_types:
          - min
          - mean
          - max
        chart_type: line
        entities:
          - sensor.gang_hua_ran_qi_1500185660_ben_qi_yong_qi
          - sensor.gang_hua_ran_qi_1500185695_ben_qi_yong_qi

      # ---------- 账户余额与欠费 ----------
      - type: custom:apexcharts-card
        graph_span: "13month"
        header:
          show: true
          title: 账户余额与欠费（¥）
        series:
          - entity: sensor.gang_hua_ran_qi_1500185660_zhang_hu_yu_e
            name: 余额 1500185660
            type: area
            color: "#2A9D8F"
            opacity: 0.3
          - entity: sensor.gang_hua_ran_qi_1500185660_qian_fei_jin_e
            name: 欠费 1500185660
            type: line
            color: "#E63946"
          - entity: sensor.gang_hua_ran_qi_1500185695_zhang_hu_yu_e
            name: 余额 1500185695
            type: area
            color: "#8AB17D"
            opacity: 0.3
          - entity: sensor.gang_hua_ran_qi_1500185695_qian_fei_jin_e
            name: 欠费 1500185695
            type: line
            color: "#F4A261"

      # ---------- 账单明细（按属性下钻） ----------
      - type: entities
        title: 账单明细 · 1500185660
        entities:
          - entity: sensor.gang_hua_ran_qi_1500185660_zhang_qi
          - entity: sensor.gang_hua_ran_qi_1500185660_ben_qi_yong_qi
          - entity: sensor.gang_hua_ran_qi_1500185660_ben_qi_zhang_dan_jin_e
          - entity: sensor.gang_hua_ran_qi_1500185660_yong_qi_dan_jia
          - entity: sensor.gang_hua_ran_qi_1500185660_zhang_hu_yu_e
          - entity: sensor.gang_hua_ran_qi_1500185660_qian_fei_jin_e
            attribute: 欠费笔数
          - entity: sensor.gang_hua_ran_qi_1500185660_zhang_hu_yu_e
            attribute: 上次抄表日期
          - entity: sensor.gang_hua_ran_qi_1500185660_zhang_hu_yu_e
            attribute: 户址
          - entity: sensor.gang_hua_ran_qi_1500185660_ben_qi_zhang_dan_jin_e
            attribute: 阶梯明细

      - type: entities
        title: 账单明细 · 1500185695
        entities:
          - entity: sensor.gang_hua_ran_qi_1500185695_zhang_qi
          - entity: sensor.gang_hua_ran_qi_1500185695_ben_qi_yong_qi
          - entity: sensor.gang_hua_ran_qi_1500185695_ben_qi_zhang_dan_jin_e
          - entity: sensor.gang_hua_ran_qi_1500185695_yong_qi_dan_jia
          - entity: sensor.gang_hua_ran_qi_1500185695_zhang_hu_yu_e
          - entity: sensor.gang_hua_ran_qi_1500185695_qian_fei_jin_e
            attribute: 欠费笔数
          - entity: sensor.gang_hua_ran_qi_1500185695_zhang_hu_yu_e
            attribute: 上次抄表日期
          - entity: sensor.gang_hua_ran_qi_1500185695_zhang_hu_yu_e
            attribute: 户址
          - entity: sensor.gang_hua_ran_qi_1500185695_ben_qi_zhang_dan_jin_e
            attribute: 阶梯明细

