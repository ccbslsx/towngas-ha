# ============================================================
# 港华燃气 Towngas · Lovelace 仪表盘（用气 / 账单 / 历史比对）
# ============================================================
# 适用：Home Assistant
#
# 【前置依赖】
#   用到了 apexcharts-card（HACS 社区卡片，做历史比对最顺手）。
#   安装：HACS → 自定义仓库 → 添加 https://github.com/RomRider/apexcharts-card
#         （类别：Dashboard）→ 下载 → 重启前端（F5）。
#
# 【实体命名 · 重要】
#   你的 HA 把中文名转成了拼音 slug，实体 id 形如：
#       sensor.gang_hua_ran_qi_<subs_code>_<拼音>
#   例：sensor.gang_hua_ran_qi_1500185660_ben_qi_biao_shu   （本期表数）
#       sensor.gang_hua_ran_qi_1500185660_ben_qi_yong_qi    （本期用气）
#   拼音映射表：
#       本期表数=ben_qi_biao_shu   本期用气=ben_qi_yong_qi   上期表数=shang_qi_biao_shu
#       本期账单金额=ben_qi_zhang_dan_jin_e   用气单价=yong_qi_dan_jie
#       账户余额=zhang_hu_yu_e   欠费金额=qian_fei_jin_e   账期=zhang_qi
#
# 【排版策略 · 兼顾"铺满整屏" + "顺序可控"】
#   外层 view：panel: false + layout.grid-template-columns: 1fr
#              → 关掉 panel 居中模式 + 强制单列拉伸铺满整屏
#   内层 vertical-stack → 保证按指定顺序展示：
#     1. markdown 头部说明（一行宽）
#     2. grid: 2 列并排展示两张 glance 概览卡
#     3. vertical-stack: 3 张图表全宽堆叠
#   这样做的好处：既铺满整屏（无左右留白），又排版整齐（不随机打散）。
#
# 【用法】
#   方式一（独立仪表盘）：设置 → 仪表盘 → + 添加仪表盘 → 从空开始 →
#           右上角 ⋮ → 原始配置编辑器 → 把本文件整个 views: 段粘进去保存。
#   方式二（并入现有）：把你现有 dashboard 原始配置里本文件 views: 内的 view 贴进它的 views: 列表。
#   ⚠️ 关键：必须粘贴整段（含 panel: false 和 layout:），不能只粘贴 cards: 段
# ============================================================

title: 港华燃气
views:
  - title: 燃气总览
    path: towngas
    icon: mdi:gas-cylinder
    badges: []
    # 关掉 panel 模式（默认会居中 + 留白）
    panel: false
    # 强制单列拉伸铺满整屏（覆盖默认 auto-fill 多列）
    layout:
      grid-template-columns: 1fr
      grid-template-rows: auto
    cards:

      # ---------- 顶层 vertical-stack：保证内部按指定顺序展示 ----------
      - type: vertical-stack
        cards:

          # ---------- 1. 头部说明（整行宽度） ----------
          - type: markdown
            content: |
              # 🔥 港华燃气 · 用气与账单看板
              数据来源：微信中央 VCC 网关，默认每 6 小时刷新一次。
              所有「本期」数值取自最近一个抄表账期（如 `2026-08`）。
              月度柱状图即为 **历史比对**。

          # ---------- 2. 两户号概览（grid 2 列 · 横向并排对齐） ----------
          - type: grid
            columns: 2
            square: false
            cards:
              - type: glance
                title: 概览 · 1500185660
                columns: 4
                show_state: true
                show_name: true
                show_icon: true
                entities:
                  - sensor.gang_hua_ran_qi_1500185660_ben_qi_yong_qi
                  - sensor.gang_hua_ran_qi_1500185660_ben_qi_biao_shu
                  - sensor.gang_hua_ran_qi_1500185660_shang_qi_biao_shu
                  - sensor.gang_hua_ran_qi_1500185660_ben_qi_zhang_dan_jin_e
                  - sensor.gang_hua_ran_qi_1500185660_yong_qi_dan_jie
                  - sensor.gang_hua_ran_qi_1500185660_zhang_hu_yu_e
                  - sensor.gang_hua_ran_qi_1500185660_qian_fei_jin_e
                  - sensor.gang_hua_ran_qi_1500185660_zhang_qi
              - type: glance
                title: 概览 · 1500185695
                columns: 4
                show_state: true
                show_name: true
                show_icon: true
                entities:
                  - sensor.gang_hua_ran_qi_1500185695_ben_qi_yong_qi
                  - sensor.gang_hua_ran_qi_1500185695_ben_qi_biao_shu
                  - sensor.gang_hua_ran_qi_1500185695_shang_qi_biao_shu
                  - sensor.gang_hua_ran_qi_1500185695_ben_qi_zhang_dan_jin_e
                  - sensor.gang_hua_ran_qi_1500185695_yong_qi_dan_jie
                  - sensor.gang_hua_ran_qi_1500185695_zhang_hu_yu_e
                  - sensor.gang_hua_ran_qi_1500185695_qian_fei_jin_e
                  - sensor.gang_hua_ran_qi_1500185695_zhang_qi

          # ---------- 3. 三张图表（全宽堆叠 · 顺序固定） ----------
          - type: vertical-stack
            cards:

              # ---- 累计表数对比（柱状） ----
              - type: custom:apexcharts-card
                graph_span: "13month"
                header:
                  show: true
                  title: 累计表数对比（m³）
                series:
                  - entity: sensor.gang_hua_ran_qi_1500185660_ben_qi_biao_shu
                    name: "累计表数 1500185660"
                    type: column
                    color: "#E63946"
                  - entity: sensor.gang_hua_ran_qi_1500185695_ben_qi_biao_shu
                    name: "累计表数 1500185695"
                    type: column
                    color: "#2A9D8F"

              # ---- 月度用气对比（历史比对） ----
              - type: custom:apexcharts-card
                graph_span: "13month"
                header:
                  show: true
                  title: 月度用气对比（历史比对 · m³）
                series:
                  - entity: sensor.gang_hua_ran_qi_1500185660_ben_qi_yong_qi
                    name: "1500185660"
                    type: column
                    color: "#457B9D"
                    group_by:
                      func: avg
                      duration: 1month
                  - entity: sensor.gang_hua_ran_qi_1500185695_ben_qi_yong_qi
                    name: "1500185695"
                    type: column
                    color: "#2A9D8F"
                    group_by:
                      func: avg
                      duration: 1month

              # ---- 账单金额趋势 ----
              - type: custom:apexcharts-card
                graph_span: "13month"
                header:
                  show: true
                  title: 账单金额趋势（¥）
                series:
                  - entity: sensor.gang_hua_ran_qi_1500185660_ben_qi_zhang_dan_jin_e
                    name: "账单 1500185660"
                    type: area
                    color: "#E63946"
                    opacity: 0.35
                  - entity: sensor.gang_hua_ran_qi_1500185695_ben_qi_zhang_dan_jin_e
                    name: "账单 1500185695"
                    type: area
                    color: "#2A9D8F"
                    opacity: 0.35