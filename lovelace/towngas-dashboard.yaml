# ============================================================
# 港华燃气 Towngas · Lovelace 仪表盘（用气 / 账单 / 历史比对）
# ============================================================
# 适用：Home Assistant
#
# 【前置依赖】
#   用到了 apexcharts-card（HACS 社区卡片，做历史比对最顺手）。
#   安装：HACS → 自定义仓库 → 添加 https://github.com/RomRider/apexcharts-card
#         （类别：Dashboard）→ 下载 → 重启前端（F5）。
#
# 【实体命名 · 重要】
#   你的 HA 把中文名转成了拼音 slug，实体 id 形如：
#       sensor.gang_hua_ran_qi_<subs_code>_<拼音>
#   例：sensor.gang_hua_ran_qi_1500185660_ben_qi_biao_shu   （本期表数）
#       sensor.gang_hua_ran_qi_1500185660_ben_qi_yong_qi    （本期用气）
#   拼音映射表：
#       本期表数=ben_qi_biao_shu   本期用气=ben_qi_yong_qi   上期表数=shang_qi_biao_shu
#       本期账单金额=ben_qi_zhang_dan_jin_e   用气单价=yong_qi_dan_jie
#       账户余额=zhang_hu_yu_e   欠费金额=qian_fei_jin_e   账期=zhang_qi
#
# 【用法】
#   方式一（独立仪表盘）：设置 → 仪表盘 → + 添加仪表盘 → 从空开始 →
#           右上角 ⋮ → 原始配置编辑器 → 把本文件整个 views: 段粘进去保存。
#   方式二（并入现有）：把你现有 dashboard 原始配置里本文件 views: 内的 view 贴进它的 views: 列表。
# ============================================================

title: 港华燃气
views:
  - title: 燃气总览
    path: towngas
    icon: mdi:gas-cylinder
    badges: []
    cards:

      # ---------- 1. 头部说明（整行宽度） ----------
      - type: markdown
        content: |
          # 🔥 港华燃气 · 用气与账单看板
          数据来源：微信中央 VCC 网关，默认每 6 小时刷新一次。
          所有「本期」数值取自最近一个抄表账期（如 `2026-08`）。
          月度柱状图即为 **历史比对**。

      # ---------- 2. 两户号概览（并排 · entities 卡 + 图标） ----------
      - type: horizontal-stack
        cards:
          - type: entities
            title: 概览 · 1500185660
            show_header_toggle: false
            entities:
              - entity: sensor.gang_hua_ran_qi_1500185660_ben_qi_yong_qi
                name: 本期用气
                icon: mdi:fire
              - entity: sensor.gang_hua_ran_qi_1500185660_ben_qi_biao_shu
                name: 本期表数
                icon: mdi:gauge
              - entity: sensor.gang_hua_ran_qi_1500185660_shang_qi_biao_shu
                name: 上期表数
                icon: mdi:gauge-low
              - entity: sensor.gang_hua_ran_qi_1500185660_ben_qi_zhang_dan_jin_e
                name: 本期账单
                icon: mdi:receipt-text
              - entity: sensor.gang_hua_ran_qi_1500185660_yong_qi_dan_jie
                name: 用气单价
                icon: mdi:currency-cny
              - entity: sensor.gang_hua_ran_qi_1500185660_zhang_hu_yu_e
                name: 账户余额
                icon: mdi:wallet
              - entity: sensor.gang_hua_ran_qi_1500185660_qian_fei_jin_e
                name: 欠费金额
                icon: mdi:cash-remove
              - entity: sensor.gang_hua_ran_qi_1500185660_zhang_qi
                name: 当前账期
                icon: mdi:calendar

          - type: entities
            title: 概览 · 1500185695
            show_header_toggle: false
            entities:
              - entity: sensor.gang_hua_ran_qi_1500185695_ben_qi_yong_qi
                name: 本期用气
                icon: mdi:fire
              - entity: sensor.gang_hua_ran_qi_1500185695_ben_qi_biao_shu
                name: 本期表数
                icon: mdi:gauge
              - entity: sensor.gang_hua_ran_qi_1500185695_shang_qi_biao_shu
                name: 上期表数
                icon: mdi:gauge-low
              - entity: sensor.gang_hua_ran_qi_1500185695_ben_qi_zhang_dan_jin_e
                name: 本期账单
                icon: mdi:receipt-text
              - entity: sensor.gang_hua_ran_qi_1500185695_yong_qi_dan_jie
                name: 用气单价
                icon: mdi:currency-cny
              - entity: sensor.gang_hua_ran_qi_1500185695_zhang_hu_yu_e
                name: 账户余额
                icon: mdi:wallet
              - entity: sensor.gang_hua_ran_qi_1500185695_qian_fei_jin_e
                name: 欠费金额
                icon: mdi:cash-remove
              - entity: sensor.gang_hua_ran_qi_1500185695_zhang_qi
                name: 当前账期
                icon: mdi:calendar

      # ---------- 3. 主图表（vertical-stack · 全宽堆叠 · 窄列最易读） ----------
      - type: vertical-stack
        cards:

          # ---- 用气量与累计表数趋势（仅累计对比 · 2 户号） ----
          - type: custom:apexcharts-card
            graph_span: "13month"
            header:
              show: true
              title: 累计表数对比（m³）
            series:
              - entity: sensor.gang_hua_ran_qi_1500185660_ben_qi_biao_shu
                name: "累计表数 1500185660"
                type: line
                color: "#E63946"
                stroke_width: 3
                curve: smooth
              - entity: sensor.gang_hua_ran_qi_1500185695_ben_qi_biao_shu
                name: "累计表数 1500185695"
                type: line
                color: "#2A9D8F"
                stroke_width: 3
                curve: smooth

          # ---- 月度用气对比（历史比对核心） ----
          - type: custom:apexcharts-card
            graph_span: "13month"
            header:
              show: true
              title: 月度用气对比（历史比对 · m³）
            series:
              - entity: sensor.gang_hua_ran_qi_1500185660_ben_qi_yong_qi
                name: "1500185660"
                type: column
                color: "#457B9D"
                group_by:
                  func: avg
                  duration: 1month
              - entity: sensor.gang_hua_ran_qi_1500185695_ben_qi_yong_qi
                name: "1500185695"
                type: column
                color: "#2A9D8F"
                group_by:
                  func: avg
                  duration: 1month

          # ---- 账单金额趋势 ----
          - type: custom:apexcharts-card
            graph_span: "13month"
            header:
              show: true
              title: 账单金额趋势（¥）
            series:
              - entity: sensor.gang_hua_ran_qi_1500185660_ben_qi_zhang_dan_jin_e
                name: "账单 1500185660"
                type: area
                color: "#E63946"
                opacity: 0.35
              - entity: sensor.gang_hua_ran_qi_1500185695_ben_qi_zhang_dan_jin_e
                name: "账单 1500185695"
                type: area
                color: "#2A9D8F"
                opacity: 0.35
